name: build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build portable release
        shell: pwsh
        run: .\scripts\build.ps1 -DotnetExecutable dotnet

      - uses: actions/upload-artifact@v4
        with:
          name: console-ssh-win-x64
          path: dist/console-ssh-*-win-x64.zip
